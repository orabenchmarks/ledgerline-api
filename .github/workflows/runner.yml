name: runner-image
# Publishes the benchme runner image for this repository (the checkout at the
# commit + deps + /runner.sh; no hidden tests). Tagged by commit SHA so a task
# spec pins exactly what it was authored against.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/runner.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/runner-ledgerline-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/runner-ledgerline-api:main
